<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>我的主页</title>
  <style>
    body {
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      background: #f4f6f5;
      margin: 0;
      padding: 60px 20px;
      line-height: 1.9;
      color: #222;
    }
    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 44px 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
    }
    h1 { color: #0a8754; margin: 18px 0 8px; }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      background: #e8f3ee;
    }
    a { color: #0a8754; }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="me.jpg" alt="我的照片">
    <h1>你好，我是陆健</h1>
    <p>大一学生，正在学着把脑子里的想法，变成能打开的网页。</p>
    <p>
      <a href="https://github.com/">GitHub</a> ·
      <a href="mailto:you@example.com">邮件</a>
    </p>
  </div>
</body>
</html>
